title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Share an idea for SuperCommands. Describe the user problem first. This discussion does not promise implementation or a release date.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow and who would benefit.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed improvement
      description: Describe the behavior you would like and any alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Use sanitized examples. Do not include personal records or credentials.
